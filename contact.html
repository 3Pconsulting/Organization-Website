<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Contact 3P Help Me</title>
<link rel="canonical" href="https://3phelpme.com/contact.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="3P Help Me">
<meta property="og:title" content="Contact 3P Help Me">
<meta property="og:description" content="Tell us what's going on in your business. A short form — no scheduler, no quiz — and 3P will follow up personally.">
<meta property="og:url" content="https://3phelpme.com/contact.html">
<meta property="og:image" content="https://3phelpme.com/assets/images/3p-owner-overload-hero.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T33MLE0MJM"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta content="Tell us what's going on in your business. A short form — no scheduler, no quiz — and 3P will follow up personally." name="description"/>
<link href="assets/logo/3P_HelpMe_Circle.png" rel="icon" type="image/png"/>
<link href="assets/css/product-line.css" rel="stylesheet"/>
<style>
.form-consent{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:22px 0 18px;
  padding:16px 18px;
  border:1px solid rgba(212,160,23,.35);
  background:#071525;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
}
.form-consent input{
  width:auto;
  margin-top:3px;
  accent-color:var(--gold);
  flex:0 0 auto;
}
.form-consent a{
  color:var(--gold-light);
  text-decoration:none;
}
.form-consent a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>
<div id="site-header-mount"></div>
<main class="section cream">
<div class="wrap checkout-wrap">
<div class="checkout-card">
<div class="eyebrow">CONTACT 3P</div>
<h1 style="font-size:44px">Tell us what's going on.</h1>
<p class="system-note" style="font-size:15px;margin-top:10px">No scheduler, no quiz. Send the short version and 3P will follow up personally — usually within one business day.</p>
<form action="https://formspree.io/f/mvzezlzz" id="contactForm" method="POST">
<input name="_subject" type="hidden" value="3P Website — Quick Contact"/>
<input name="request_type" type="hidden" value="Quick contact form"/>
<div class="form-grid" style="margin-top:28px">
<div class="form-field"><label for="name">Your name</label><input id="name" name="name" required=""/></div>
<div class="form-field"><label for="business">Business name</label><input id="business" name="business_name" required=""/></div>
<div class="form-field"><label for="email">Email</label><input id="email" name="email" required="" type="email"/></div>
<div class="form-field"><label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel"/></div>
<div class="form-field full">
<label for="interest">What's this about?</label>
<select id="interest" name="interest">
<option>Not sure yet — just want to talk</option>
<option>A specific Business Fix (fixed-price product)</option>
<option>On-Demand Operations Support</option>
<option>Systems, Automation &amp; Integration</option>
<option>Something else</option>
</select>
</div>
<div class="form-field full"><label for="message">What's going on?</label><textarea id="message" name="message" placeholder="A sentence or two is fine — what's slowing you down, and what would you want fixed first?" required=""></textarea></div>
</div>
<div class="notice">This goes straight to 3P — not a call center, not a scheduler. Expect a reply from a person, not a booking link.</div>

<label class="form-consent">
  <input name="terms_acceptance" required type="checkbox" value="Accepted Terms of Service, Privacy Policy, and Disclaimer"/>
  <span>
    I agree to the 3P Help Me
    <a href="/terms-of-service.html" target="_blank" rel="noopener">Terms of Service</a>,
    <a href="/privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>, and
    <a href="/disclaimer.html" target="_blank" rel="noopener">Disclaimer</a>.
  </span>
</label>

<button class="button" type="submit">Send This to 3P</button>
</form>
</div>
</div>
</main>
<div id="site-footer-mount"></div>

<script defer="defer" src="/assets/js/site-include.js"></script></body>
</html>
