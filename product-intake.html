<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>3P Business Fix Intake</title>
<meta name="robots" content="noindex,follow">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T33MLE0MJM"></script>

  window.dataLayer = window.dataLayer || [];

<link href="assets/css/product-line.css" rel="stylesheet"/>
</head>
<body>
<div id="site-header-mount"></div>
<main class="section cream">
<div class="wrap checkout-wrap">
<div class="checkout-card">
<div class="eyebrow">PRODUCT-SPECIFIC QUESTIONNAIRE</div>
<h1 id="intakeOffer" style="font-size:44px">3P Business Fix</h1>
<p>Complete this after purchase. The delivery clock begins when required information, files, access, and decisions are complete.</p>
<form id="intakeForm" method="POST">
<input id="intakeSlug" name="offer_slug" type="hidden"/>
<input id="intakeOfferInput" name="offer" type="hidden"/>
<input name="_subject" type="hidden" value="3P Business Fix Intake"/>
<div class="form-grid">
<div class="form-field"><label for="clientName">Your name</label><input id="clientName" name="client_name" required=""/></div>
<div class="form-field"><label for="clientBusiness">Business name</label><input id="clientBusiness" name="business_name" required=""/></div>
<div class="form-field"><label for="clientEmail">Business email</label><input id="clientEmail" name="email" required="" type="email"/></div>
<div class="form-field"><label for="employees">Number of employees</label><input id="employees" max="500" min="1" name="employees" type="number"/></div>
<div class="form-field full"><label for="problem">Describe the problem this purchase must fix.</label><textarea id="problem" name="problem" required=""></textarea></div>
<div class="form-field full"><label for="current">How is this handled today?</label><textarea id="current" name="current_process" required=""></textarea></div>
<div class="form-field full"><label for="tools">Which software, spreadsheets, inboxes, drives, or tools are involved?</label><textarea id="tools" name="tools"></textarea></div>
<div class="form-field full"><label for="people">Who owns the work today, and who must approve the final setup?</label><textarea id="people" name="people_and_approver" required=""></textarea></div>
<div class="form-field full"><label for="deadline">Is there a real business deadline or event affecting delivery?</label><textarea id="deadline" name="deadline"></textarea></div>
<div class="form-field full"><label for="access">List the files, exports, examples, or access you will provide.</label><textarea id="access" name="files_and_access" required=""></textarea></div>
<div class="form-field full">
<label><input name="scope_acknowledgement" required="" type="checkbox"/> I understand that work outside the published product scope will be quoted separately before it begins.</label>
</div>
</div>
<button class="button" type="submit">Submit My Intake</button>
</form>
<div class="notice hidden" id="intakeConfigNotice">The live Formspree endpoint must be added before this form is deployed.</div>
</div>
</div>
</main>
<div id="site-footer-mount"></div>

<script src="assets/js/product-catalog.js"></script>
<script src="assets/js/checkout-config.js"></script>
<script src="assets/js/intake.js"></script>
<script defer="defer" src="/assets/js/site-include.js"></script></body>
</html>
